services:
  intranet:
    build:
      context: .
    container_name: intranet-vitafoods
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      TRUST_PROXY: "0"
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
